name: Build Executables

on:
  push:
    branches:
      - releases

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-latest', 'ubuntu-latest', 'macos-latest']

    env:
      MAIN_PY_FILE: 'engine/main.py'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.10.x

    - name: Install dependencies
      run: |
        pip install pygame pyinstaller pillow
      shell: bash

    - name: Build executable (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --onefile --windowed --icon="images/icon.png" --add-data="engine;engine" --add-data="bot;bot" --add-data="images;images" --add-data="sounds;sounds" --name="ChessBot" --distpath="dist" ${{ env.MAIN_PY_FILE }}
      shell: bash

    - name: Build executable (Linux & macOS)
      if: matrix.os != 'windows-latest'
      run: |
        pyinstaller --onefile --windowed --icon="images/icon.png" --add-data="engine:engine" --add-data="bot:bot" --add-data="images:images" --add-data="sounds:sounds" --name="ChessBot" --distpath="dist" ${{ env.MAIN_PY_FILE }}
      shell: bash

    - name: Create Artifact (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: windows-executables
        path: dist/

    - name: Create Artifact (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: linux-executables
        path: dist/

    - name: Create Artifact (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: macos-executables
        path: dist/

    - name: List files in dist folder
      run: ls -R ./dist/
      shell: bash